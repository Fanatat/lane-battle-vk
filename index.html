<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Две крепости</title>
<!-- Шрифты — локальные (24.09.2026): сервер шрифтов Google из России висел до
     13,5 с и падал, см. assets/fonts/fonts.css. -->
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Раунд 15 (И1): иконки интерфейса — один SVG-спрайт вместо юникод-глифов
     и эмодзи (на разных ОС эмодзи рисовались по-разному и выглядели
     «дёшево»). Используются через <svg class="ico"><use href="#i-…"/></svg>,
     цвет — currentColor кнопки, контур — тёмный. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-sword" viewBox="0 0 24 24"><g stroke="#1a120a" stroke-width="1.3" stroke-linejoin="round" fill="currentColor"><path d="M20.5 2.5 21.5 3.5 11 14 9.8 12.8Z"/><path d="M5.5 11.5 12.5 18.5 11 20 4 13Z"/><path d="M6.6 16.2 7.8 17.4 3.6 21.6 2.4 20.4Z"/></g></symbol>
    <symbol id="i-burst" viewBox="0 0 24 24"><path d="M12 1.5 14.6 9.4 22.5 12 14.6 14.6 12 22.5 9.4 14.6 1.5 12 9.4 9.4Z" fill="currentColor" stroke="#1a120a" stroke-width="1.3" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.2" fill="#fff6d0"/></symbol>
    <!-- Раунд 15 (И5): единый набор иконок тулбара и тач-кнопок — Залп
         (дождь стрел), Эра (корона + стрелка вверх), спец-удар (вихрь вокруг
         меча), кирка (крупная головка + рукоять), портрет героя (голова
         золотого капитана, как в риге: ART.hero). Тот же язык: заливка
         currentColor/цвета рига + тёмный контур 1.1–1.4. Генератор путей —
         вне сборки, координаты зафиксированы здесь. -->
    <symbol id="i-volley" viewBox="0 0 24 24"><g stroke="#1a120a" stroke-width="1.1" stroke-linejoin="round"><path d="M4.3 4.1L5.5 1.9L6.9 5.4L5.6 7.4ZM2.3 4.9L-0.1 4.1L1.3 7.6L3.7 8.2Z" fill="#f2e6cf"/><path d="M4.1 3.7L6.8 10.4L4.9 11.2L2.2 4.5Z" fill="#c8955a"/><path d="M7.8 15.6L8.2 9.8L3.5 11.7Z" fill="currentColor"/><path d="M10.9 11.1L12.1 8.9L13.5 12.4L12.2 14.4ZM8.9 11.9L6.5 11.1L7.9 14.6L10.3 15.2Z" fill="#f2e6cf"/><path d="M10.7 10.7L13.4 17.4L11.5 18.2L8.8 11.5Z" fill="#c8955a"/><path d="M14.4 22.6L14.8 16.8L10.1 18.7Z" fill="currentColor"/><path d="M17.5 3.3L18.7 1.1L20.1 4.6L18.8 6.6ZM15.5 4.1L13.1 3.3L14.5 6.8L16.9 7.4Z" fill="#f2e6cf"/><path d="M17.3 2.9L20.0 9.6L18.1 10.4L15.4 3.7Z" fill="#c8955a"/><path d="M21.0 14.8L21.4 9.0L16.7 10.9Z" fill="currentColor"/></g></symbol>
    <symbol id="i-spin" viewBox="0 0 24 24"><g stroke="#1a120a" stroke-width="1.2" stroke-linejoin="round" fill="currentColor"><path d="M2.4 15.5L2.0 13.8L1.8 12.0L2.0 10.2L2.4 8.5L3.2 6.9L4.2 5.4L5.4 4.2L6.9 3.2L8.5 2.4L10.2 2.0L12.0 1.8L13.8 2.0L15.5 2.4L17.1 3.2L18.6 4.2L19.8 5.4L16.9 7.9L16.1 7.1L15.2 6.4L14.2 5.8L13.2 5.4L12.0 5.1L10.8 5.0L9.5 5.1L8.2 5.4L7.0 6.0L5.8 6.8L4.7 7.8L3.8 9.0L3.1 10.4L2.6 12.0L2.5 13.7L2.7 15.4Z"/><path d="M21.6 8.5L22.0 10.2L22.2 12.0L22.0 13.8L21.6 15.5L20.8 17.1L19.8 18.6L18.6 19.8L17.1 20.8L15.5 21.6L13.8 22.0L12.0 22.2L10.2 22.0L8.5 21.6L6.9 20.8L5.4 19.8L4.2 18.6L7.1 16.1L7.9 16.9L8.8 17.6L9.8 18.2L10.8 18.6L12.0 18.9L13.2 19.0L14.5 18.9L15.8 18.6L17.0 18.0L18.2 17.2L19.3 16.2L20.2 15.0L20.9 13.6L21.4 12.0L21.5 10.3L21.3 8.6Z"/></g><g stroke="#1a120a" stroke-width="1.2" stroke-linejoin="round" fill="currentColor"><path d="M17.2 5.6 18.4 6.8 11.2 14 10 12.8Z"/><path d="M7.4 11.4 12.6 16.6 11.5 17.7 6.3 12.5Z"/><path d="M8.3 14.9 9.1 15.7 6.4 18.4 5.6 17.6Z"/></g></symbol>
    <symbol id="i-age" viewBox="0 0 24 24"><g stroke="#1a120a" stroke-width="1.3" stroke-linejoin="round"><path d="M12 1.2 19.2 8.6h-4.4v4.6H9.2V8.6H4.8Z" fill="#fff3c4"/><path d="M3.2 21.5 2.4 12.2l4.9 3.6L12 10l4.7 5.8 4.9-3.6-.8 9.3Z" fill="currentColor"/><circle cx="12" cy="18.2" r="1.5" fill="#e0503a" stroke-width="1"/></g></symbol>
    <symbol id="i-pick" viewBox="0 0 24 24"><g transform="rotate(-40 12 12)" stroke="#1a120a" stroke-width="1.3" stroke-linejoin="round"><path d="M10.6 6.5h2.8l-.2 16.5h-2.4Z" fill="#c8955a"/><path d="M1.2 10.2C4 3.2 20 3.2 22.8 10.2 18.5 7.6 5.5 7.6 1.2 10.2Z" fill="currentColor"/><path d="M10 4.4h4v4.2h-4Z" fill="#8a6a44"/></g></symbol>
    <symbol id="i-hero" viewBox="0 0 24 24"><path d="M3.4 24C3.9 18.2 20.1 18.2 20.6 24Z" fill="#ffd35c" stroke="#3a2406" stroke-width="1.4" stroke-linejoin="round"/><circle cx="12" cy="12.6" r="6.3" fill="#ffd35c" stroke="#3a2406" stroke-width="1.5"/><circle cx="10.6" cy="11" r="3.3" fill="#fff" fill-opacity=".25"/><path d="M7 8.9H17L12 1.6Z" fill="#f6c94a" stroke="#3a2406" stroke-width="1.1" stroke-linejoin="round"/></symbol>
    <!-- r15 И10: «Боевой клич» — изогнутый боевой рог (кость + медные
         кольца), а не динамик/громкоговоритель (куратор: «иконка динамика»). -->
    <symbol id="i-horn" viewBox="0 0 24 24"><g stroke="#1a120a" stroke-width="1.2" stroke-linejoin="round"><path d="M2.6 15.6C6.2 18.4 10.6 17 13.4 13.4L17.6 4.4 23 10.6 16.6 15.8C12.4 20.8 6.2 21.8 2.2 18.6Z" fill="#f2e6cf"/><ellipse cx="20.3" cy="7.5" rx="3.9" ry="1.5" transform="rotate(49 20.3 7.5)" fill="#5a3214"/><path d="M7.4 16.9 8.6 20.2 10.3 19.6 9.3 16.3ZM12.2 13.9 14.6 16.4 15.9 15.2 13.5 12.7Z" fill="currentColor" stroke-width="1"/><circle cx="2.3" cy="17.1" r="1.4" fill="currentColor" stroke-width="1"/></g></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><g fill="currentColor" stroke="#1a120a" stroke-width="1.2"><rect x="5.5" y="4" width="4.6" height="16" rx="1.3"/><rect x="13.9" y="4" width="4.6" height="16" rx="1.3"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="4.2" stroke-dasharray="3.2 3.24"/><circle cx="12" cy="12" r="6.6" fill="currentColor" stroke="#1a120a" stroke-width="1.1"/><circle cx="12" cy="12" r="2.6" fill="#2a1a0e"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.6"/><rect x="5" y="10.5" width="14" height="10.5" rx="2.2" fill="currentColor" stroke="#1a120a" stroke-width="1.2"/><circle cx="12" cy="15.3" r="1.6" fill="#1a120a"/></symbol>
    <!-- r15 И12: крестик закрытия (шапка справки) и стопка монет (апгрейд
         дохода — та же, что на кнопке Q; в справке вместо эмодзи «💲»). -->
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5.2 8.4 8.4 5.2 12 8.8l3.6-3.6 3.2 3.2-3.6 3.6 3.6 3.6-3.2 3.2-3.6-3.6-3.6 3.6-3.2-3.2 3.6-3.6Z" fill="currentColor" stroke="#1a120a" stroke-width="1.3" stroke-linejoin="round"/></symbol>
    <symbol id="i-coins" viewBox="0 0 48 48"><g stroke="#1a120a" stroke-width="2.4"><ellipse cx="20" cy="37" rx="13" ry="5.5" fill="#e0a030"/><ellipse cx="20" cy="31" rx="13" ry="5.5" fill="#ffd35c"/><ellipse cx="30" cy="22" rx="13" ry="5.5" fill="#e0a030"/><ellipse cx="30" cy="15" rx="13" ry="5.5" fill="#ffe08a"/></g><path d="M38 3v10M33 8h10" stroke="#7bd98a" stroke-width="3.4" stroke-linecap="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.2 6.8.8-5 4.7 1.3 6.7L12 17.3l-6 3.3 1.3-6.7-5-4.7 6.8-.8Z" fill="currentColor" stroke="#1a120a" stroke-width="1.2" stroke-linejoin="round"/></symbol>
  </defs>
</svg>
<div id="rotatePrompt">
  <div class="icon">⟳</div>
  <p data-i18n-html="rotate.text">Поверните устройство горизонтально —<br>игра рассчитана на альбомную ориентацию.</p>
</div>
<div id="stage">
  <div id="arenaWrap">
    <canvas id="game" width="1000" height="400"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-top">
        <!-- Раунд 15 (И1): тонкие полосы HP без деревянных плашек (~30px с
             подписью), золото — крупно над панелью покупки (.hud-bottom),
             кристаллы — маленьким счётчиком под своей полосой. -->
        <div class="core-box core-player">
          <div class="core-head"><span class="core-flag"></span><span class="core-label">HP</span><span class="bar-text" id="playerCoreText">1000/1000</span></div>
          <div class="bar bar-hp-player"><div class="bar-fill" id="playerCoreFill"></div></div>
          <div class="diamond-row" data-i18n-title="currency.name" title="Кристаллы"><span class="diamond-dot"></span><span id="diamondText">0</span></div>
          <!-- r15 И16: на тач-экранах портрет героя и кнопка выкупа переезжают
               сюда, под свою полосу HP (layoutHudBottomRow в game.js) — нижний
               ряд освобождается под тулбар между джойстиком и тач-кнопками. -->
          <div class="hero-slot-top" id="heroSlotTop"></div>
        </div>
        <div class="mission-title" id="missionTitle">Миссия 1</div>
        <div class="core-box core-enemy">
          <div class="core-head"><span class="bar-text" id="enemyCoreText">1000/1000</span><span class="core-label">HP</span><span class="core-flag"></span></div>
          <div class="bar bar-hp-enemy"><div class="bar-fill" id="enemyCoreFill"></div></div>
        </div>
        <button id="helpBtn" class="icon-btn hud-round" data-i18n-title="hud.helpTooltip" title="Подсказка по управлению">?</button>
        <button id="pauseBtn" class="icon-btn hud-round" data-i18n-title="hud.pauseTooltip" title="Пауза (P)"><svg class="ico"><use href="#i-pause"/></svg></button>
        <!-- Правка (баг-репорт основателя, скриншот 1788791898991.jpg):
             при фиксированном top в em плашка налезала на полосу HP врага
             и заголовок миссии, если он переносился на 2 строки (реальный
             телефон в альбомной ориентации — там ряд .hud-top заметно
             выше, чем в широком десктопном тесте). Плашка — теперь
             последний ребёнок именно .hud-top (не .hud-bottom), позиция
             в CSS считается от РЕАЛЬНОЙ высоты этого ряда (top:100%), не
             от угаданного em — подстраивается сама и под 1-строчный, и
             под 2-строчный заголовок. -->
        <!-- r15 И16 (куратор №5: «красная панель „Капитан пал“ на 20 с
             закрывает верх-центр поля»): панели над центром больше нет.
             Таймер респауна — кольцо и секунды на портрете героя
             (#heroMiniRing/#heroMiniTimer), кнопка выкупа — компактная,
             рядом с портретом: на ПК над ним (в .hud-bottom), на таче —
             справа от него под своей полосой HP (#heroSlotTop). Место
             задаёт layoutHudBottomRow() в game.js. -->
        <!-- r15 И16: «Крепость атакуют!» — короткий тост под заголовком при
             первом ударе по своей крепости и при сильном натиске (updateFortAlert). -->
        <div id="fortAlert" class="fort-alert hidden" role="status" aria-live="polite"><span data-i18n="hud.fortAttack">Крепость атакуют!</span></div>
      </div>

      <div class="hud-bottom">
        <!-- Раунд 15 (И4): подсказка новичку из двух строк заменена пошаговым
             туториалом со стрелками (js/tutorial.js, слой #tutLayer). -->
        <!-- r15 И16: кнопка выкупа героя (см. комментарий в .hud-top). -->
        <div id="heroReviveBox" class="hero-revive-box hidden">
          <!-- r15 И10: «Воскресить 30» — без «(B)» в тексте; клавиша —
               бейджем .key-badge, скрыт на тач-устройствах (style.css). -->
          <button id="btnBuyback" class="menu-btn secondary"><kbd class="key-badge">B</kbd><span class="bb-main"><span data-i18n="hud.reviveBtn">Воскресить</span> <span id="buybackCostText">50</span><span class="gold-dot"></span></span><span class="buyback-short" id="buybackShortText"></span></button>
        </div>
        <!-- r15 И13: предупреждение о копящемся золоте (game.js, updateHud).
             r15 И16: компактно — справа от счётчика 2–3 слова, полная фраза
             только первые 4 с (updateGoldWarn), не плашкой над полем. -->
        <div class="gold-row" id="goldRow" data-i18n-title="hud.goldTooltip" title="Слишком много накопленного золота усиливает врага"><span class="gold-dot"></span><span id="goldText">0</span><span class="gold-warn" id="goldWarn" role="status" hidden></span></div>
        <div class="hud-bottom-row">
          <!-- Раунд 15 (И5): индикатор героя, а не кнопка — портрет головы
               золотого капитана + полоска HP; пока герой мёртв, портрет
               серый и на нём таймер респауна (.dead, #heroMiniTimer).
               r15 И16: + кольцо оставшегося времени респауна (#heroMiniRing). -->
          <div class="hero-mini" id="heroMini" data-i18n-title="hud.heroTooltip" title="Капитан: здоровье">
            <div class="hero-mini-icon"><svg class="ico"><use href="#i-hero"/></svg><svg class="hero-mini-ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16.5" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="5"/><circle id="heroMiniRing" cx="20" cy="20" r="16.5" fill="none" stroke="#ffd35c" stroke-width="5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" transform="rotate(-90 20 20)"/></svg><span class="hero-mini-timer" id="heroMiniTimer"></span></div>
            <!-- r15 И12 (куратор №3: «полоска у портрета без подписи»): это
                 здоровье героя — подпись «HP», как у полос крепостей. -->
            <div class="hero-mini-bar-col"><span class="hero-mini-label">HP</span><div class="bar bar-hp-hero"><div class="bar-fill" id="heroFill"></div></div></div>
          </div>
          <div class="toolbar" id="toolbar">
            <!-- кнопки юнитов генерируются в game.js -->
          </div>
          <!-- Раунд 15 (И2, П6): «Залп» (кулдаун — cd-overlay, как у способностей)
               и «Новая эра» (кольцо прогресса опыта — SVG, stroke-dashoffset
               из updateHud). Видны и на тач-устройствах (не special-btn). -->
          <button class="tool-btn volley-btn" id="volleyBtn" data-i18n-title="hud.volleyTooltip" title="Залп (V)">
            <div class="tool-icon"><svg class="ico"><use href="#i-volley"/></svg></div>
            <div class="tool-cost" data-i18n="hud.volleyLabel">Залп</div>
            <div class="cd-overlay" id="volleyCd"></div>
            <div class="tool-key">V</div>
          </button>
          <button class="tool-btn age-btn disabled" id="ageBtn" data-i18n-title="hud.ageTooltip" title="Новая эра (T)">
            <!-- r15 И21 (куратор №8: «кольцо закрывает подпись — „Aɢe“»):
                 прогресс опыта — рамкой по кромке кнопки (style.css .age-ring,
                 conic-gradient по --age-p), а не кругом через подпись. -->
            <span class="age-ring" id="ageRing" aria-hidden="true"></span>
            <div class="tool-icon"><svg class="ico"><use href="#i-age"/></svg></div>
            <div class="tool-cost" data-i18n="hud.ageLabel">Эра</div>
            <div class="tool-key">T</div>
          </button>
          <button class="tool-btn special-btn" id="specialBtn" data-i18n-title="hud.specialTooltip" title="Спец-удар (R)">
            <div class="tool-icon"><svg class="ico"><use href="#i-spin"/></svg></div>
            <div class="tool-cost" data-i18n="hud.specialLabel">Вихрь</div>
            <div class="cd-overlay" id="specialCd"></div>
            <div class="tool-key">R</div>
          </button>
          <button class="tool-btn special-btn" id="pickaxeBtn" data-i18n-title="hud.pickaxeTooltip" title="Кирка (F)">
            <div class="tool-icon"><svg class="ico"><use href="#i-pick"/></svg></div>
            <div class="tool-cost" data-i18n="hud.pickaxeLabel">Кирка</div>
            <div class="cd-overlay" id="pickaxeCd"></div>
            <div class="tool-key">F</div>
          </button>
          <button class="tool-btn special-btn hidden" id="cryBtn" data-i18n-title="hud.cryTooltip" title="Боевой клич (E)">
            <div class="tool-icon"><svg class="ico"><use href="#i-horn"/></svg></div>
            <div class="tool-cost" data-i18n="hud.cryLabel">Клич</div>
            <div class="cd-overlay" id="cryCd"></div>
            <div class="tool-key">E</div>
          </button>
        </div>
      </div>
    </div>

    <div id="countdownOverlay" class="hidden">
      <div id="countdownNum">3</div>
    </div>

    <div id="heroDownFlash"></div>
    <!-- r15 И16: лёгкая красная пульсация левого края (сторона своей крепости)
         вместе с тостом «Крепость атакуют!»; pointer-events: none. -->
    <div id="fortEdge"></div>

    <div id="touchControls" class="hidden">
      <div id="joyBase"><div id="joyStick"></div></div>
      <!-- Основатель: "интуитивно удобнее, когда кнопки по разные стороны" —
           атака и кирка поменяны местами (⛏ ✦ ⚔ 📣), спец-удар и Боевой
           клич остались на прежних позициях. Только порядок в разметке —
           id, обработчики и хоткеи на ПК не менялись. -->
      <div class="touch-actions">
        <button id="touchPickaxe" class="touch-btn">
          <svg class="ico"><use href="#i-pick"/></svg><div class="cd-overlay-round" id="touchPickaxeCd"></div>
        </button>
        <button id="touchSpecial" class="touch-btn">
          <svg class="ico"><use href="#i-spin"/></svg><div class="cd-overlay-round" id="touchSpecialCd"></div>
        </button>
        <button id="touchAttack" class="touch-btn touch-main">
          <svg class="ico"><use href="#i-sword"/></svg><div class="cd-overlay-round" id="touchAttackCd"></div>
        </button>
        <button id="touchCry" class="touch-btn hidden">
          <svg class="ico"><use href="#i-horn"/></svg><div class="cd-overlay-round" id="touchCryCd"></div>
        </button>
      </div>
    </div>

    <!-- r15 И10 (куратор: «титульный экран мигает ~2 с и исчезает, кнопки
         видны, но нажать нельзя»): экран загрузки — виден с первого кадра
         до PLATFORM.ready + облачного сейва, без текста (язык ещё не
         определён) и без кнопок. Дальше: первый запуск — сразу бой миссии 1
         с отсчётом (меню не показывается), иначе — меню (конец game.js). -->
    <div id="screenLoading" class="screen" aria-busy="true">
      <div class="loading-emblem"><svg class="ico"><use href="#i-sword"/></svg></div>
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>

    <!-- Раунд 15 (И1): главное меню — крупный логотип (два слоя: обводка с
         тенью + градиентная заливка), «Играть» главной кнопкой, «Главы» и
         «Магазин» рядом под ней; звук, музыка и плейлист — в настройках за
         шестерёнкой в углу. За меню — своя сцена на канвасе (drawMenuScene). -->
    <div id="screenMenu" class="screen hidden">
      <button id="btnSettings" class="icon-btn hud-round settings-btn" data-i18n-title="settings.title" title="Настройки"><svg class="ico"><use href="#i-gear"/></svg></button>
      <div id="settingsPop" class="settings-pop hidden">
        <div class="settings-title" data-i18n="settings.title">Настройки</div>
        <button class="setting-row" id="btnMute"><span data-i18n="settings.sound">Звук</span><span class="toggle-switch"></span></button>
        <button class="setting-row" id="btnMuteMusic"><span data-i18n="settings.music">Музыка</span><span class="toggle-switch"></span></button>
        <button class="menu-btn secondary small" id="btnPlaylist" data-i18n="menu.playlist">Плейлист</button>
      </div>
      <div class="menu-main">
        <h1 class="logo"><span class="logo-back" data-i18n="game.title">ДВЕ КРЕПОСТИ</span><span class="logo-front" data-i18n="game.title" aria-hidden="true">ДВЕ КРЕПОСТИ</span></h1>
        <button class="menu-btn primary-big" id="btnPlay" data-i18n="menu.play">Играть</button>
        <div class="menu-row">
          <button class="menu-btn secondary" id="btnChapters" data-i18n="menu.chapters">Главы</button>
          <button class="menu-btn secondary" id="btnShop" data-i18n="menu.shop">Магазин</button>
        </div>
      </div>
    </div>

    <div id="screenMissions" class="screen hidden">
      <div class="panel-card">
        <!-- r15 И20 (куратор №7: «на телефоне кнопки Back в „Choose a chapter“
             не видно — нужно листать панель»): «Назад» — в закреплённой шапке,
             как в магазине и справке; прокручивается только карта глав. -->
        <div class="shop-header-row chapters-header-row">
          <h2 data-i18n="missions.title">Выбор главы</h2>
          <button class="menu-btn secondary small" id="btnBackToMenu" data-i18n="missions.back">Назад</button>
        </div>
        <div class="chapter-trail" id="chapterTrail"></div>
      </div>
    </div>

    <div id="screenShop" class="screen hidden">
      <div class="panel-card">
        <div class="shop-header-row">
          <div class="shop-header-left">
            <h2 data-i18n="shop.title">Магазин</h2>
            <p class="shop-currency" data-i18n-title="currency.name" title="Кристаллы"><span class="diamond-dot"></span> <b id="shopCurrencyText">0</b></p>
          </div>
          <button class="menu-btn secondary small" id="btnBackFromShop" data-i18n="shop.back">Назад</button>
        </div>
        <div class="shop-tabs" id="shopTabs"></div>
        <div class="shop-list" id="shopList"></div>
      </div>
    </div>

    <div id="screenHelp" class="screen overlay hidden">
      <div class="panel-card">
        <!-- r15 И12: шапка закреплена, крестик всегда виден (раньше «Назад»
             было только внизу, после прокрутки всего списка). -->
        <div class="help-header-row">
          <h2 data-i18n="help.title">Справка</h2>
          <button class="icon-btn hud-round help-close-btn" id="btnCloseHelp" data-i18n-title="help.back" title="Назад"><svg class="ico"><use href="#i-close"/></svg></button>
        </div>
        <div class="shop-list" id="helpList"></div>
        <button class="menu-btn secondary" id="btnBackFromHelp" data-i18n="help.back">Назад</button>
      </div>
    </div>

    <div id="screenPause" class="screen overlay hidden">
      <div class="popup-card">
        <h2 data-i18n="pause.title">Пауза</h2>
        <div class="mute-row">
          <button class="menu-btn secondary" id="btnMutePause">Звук: вкл</button>
          <button class="menu-btn secondary" id="btnMuteMusicPause">Музыка: вкл</button>
        </div>
        <button class="menu-btn" id="btnResume" data-i18n="pause.resume">Продолжить</button>
        <button class="menu-btn secondary" id="btnToMenuFromPause" data-i18n="pause.toMenu">В меню</button>
      </div>
    </div>

    <div id="screenPlaylist" class="screen hidden">
      <div class="panel-card">
        <h2 data-i18n="playlist.title">Плейлист</h2>
        <div class="playlist-list" id="playlistList"></div>
        <button class="menu-btn secondary" id="btnShuffle">Перемешать: выкл</button>
        <button class="menu-btn secondary" id="btnBackFromPlaylist" data-i18n="playlist.back">Назад</button>
      </div>
    </div>

    <div id="screenResult" class="screen overlay hidden">
      <!-- Раунд 15 (И4): итог боя — крупный заголовок, 1–3 звезды (появляются
           по очереди), кристаллы со счётчиком, главная кнопка («Далее» /
           «Ещё раз») первой, реклама x2 — второстепенная под ней, «Магазин»
           и «В меню» — мелкие в одну строку. -->
      <!-- r15 И10: праздник победы — вращающиеся лучи за карточкой и канвас
           конфетти поверх (#screenResult.celebrate, startConfetti в game.js). -->
      <div class="result-rays" aria-hidden="true"></div>
      <canvas id="confettiCanvas" class="hidden" aria-hidden="true"></canvas>
      <div class="popup-card" id="resultCard">
        <h2 id="resultTitle" class="result-title">Победа!</h2>
        <div class="result-stars hidden" id="resultStars"></div>
        <p class="result-reward hidden" id="resultReward">
          <span class="result-reward-label" data-i18n="result.rewardLabel">Очков за миссию</span>
          <span class="result-reward-value"><span id="resultRewardAmount">0</span><span class="diamond-dot"></span></span>
        </p>
        <p id="resultText"></p>
        <button class="menu-btn result-main" id="btnNext" data-i18n="result.next">Далее</button>
        <button class="menu-btn result-main" id="btnRetry" data-i18n="result.retry">Ещё раз</button>
        <div class="ad-reward-row hidden" id="resultAdRow"></div>
        <div class="result-minor-row">
          <button class="menu-btn secondary small" id="btnShopFromResult" data-i18n="menu.shop">Магазин</button>
          <button class="menu-btn secondary small" id="btnToMenuFromResult" data-i18n="result.toMenu">В меню</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>window.GAME_PLATFORM='vk';</script>
<script src="js/diag.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/platform.js"></script>
<script src="js/analytics.js"></script>
<script src="js/rig.js"></script>
<script src="js/vfx.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/entities.js"></script>
<script src="js/ai.js"></script>
<script src="js/game.js"></script>
</body>
</html>

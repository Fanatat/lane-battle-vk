<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Битва линий</title>
<style>
  /* ТЗ №09→10: стиль «тёплая бумага» (A-01, 01B_ИСПОЛНЕНИЕ.txt, прислан
     основателем в ходе фазы 10) — фон #f3ead6, чернила #2b2723, системный
     serif без внешних шрифтов. Панели/акцент/рамка при первой прикидке
     (без файла стандарта) были близки, но не точны — сверены и поправлены
     теперь, когда A-01 физически в папке. */
  :root {
    --paper-bg: #f3ead6;
    --paper-panel: #e9dcbd;
    --paper-panel-2: #ddccaa;
    --ink: #2b2723;
    --ink-soft: #746a58;
    --accent: #c1682f;
    --accent-ink: #2a1608;
    --success: #6f8f45;
    --success-ink: #16210a;
    --border: #b7a47e;
    --shadow: rgba(43,39,35,0.28);
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--paper-bg); overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    font-family: Georgia, 'Times New Roman', serif; color: var(--ink);
  }
  #root { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #game { display: block; width: 100%; flex: 1 1 auto; min-height: 0; background: var(--paper-bg); }

  #topBar {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 6px 14px; padding: 8px 12px; box-sizing: border-box; color: var(--ink); font-size: 16px;
    background: var(--paper-panel); border-bottom: 1px solid var(--border);
  }
  #campaignBar { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
  #trophyBar { display: flex; align-items: center; gap: 4px; }
  #foodBar { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  #foodBar .icon { font-size: 18px; }
  #foodBarTrack {
    width: 120px; height: 10px; background: var(--paper-panel-2); border-radius: 5px; overflow: hidden;
    margin-left: 4px; border: 1px solid var(--border);
  }
  #foodBarFill { height: 100%; width: 0%; background: var(--accent); transition: width 80ms linear; }

  #speedBtn, #pauseBtn, #fullscreenBtn {
    flex: 0 0 auto; min-width: 44px; min-height: 40px; border-radius: 10px; border: none;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; cursor: pointer;
  }
  #speedBtn:active, #pauseBtn:active, #fullscreenBtn:active { filter: brightness(0.9); }
  #topBarRight { display: flex; align-items: center; gap: 8px; }

  @media (max-width: 420px) {
    #topBar { font-size: 13px; padding: 6px 6px; gap: 4px 6px; }
    #foodBarTrack { width: 56px; }
    #speedBtn, #pauseBtn, #fullscreenBtn { min-width: 42px; min-height: 42px; font-size: 13px; }
  }

  #cards {
    flex: 0 0 auto; display: flex; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    box-sizing: border-box; background: var(--paper-panel); border-top: 1px solid var(--border);
  }
  .card {
    flex: 1 1 0; min-height: 64px; border-radius: 10px; border: 2px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--ink); cursor: pointer; position: relative; font-weight: 700;
    background: var(--paper-panel-2);
  }
  .card .unitIcon { width: 40px; height: 40px; display: block; }
  .card .roleLabel { font-size: 11px; font-weight: 700; opacity: 0.85; margin-top: 2px; }
  .card .cost { font-size: 13px; opacity: 0.85; font-weight: 400; }
  .card.disabled { opacity: 0.45; }
  .card.locked .cost { font-size: 18px; }
  .card.shake { animation: cardShake var(--shake-ms, 150ms) linear; }
  @keyframes cardShake {
    0% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
    100% { transform: translateX(0); }
  }

  #popup, #menuScreen, #pauseScreen {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(58,44,28,0.55); z-index: 20;
  }
  #popup.hidden, #menuScreen.hidden, #pauseScreen.hidden { display: none; }
  #popupBox, #menuBox, #pauseBox {
    background: var(--paper-bg); color: var(--ink); border-radius: 16px; padding: 28px 32px;
    text-align: center; min-width: 260px; box-shadow: 0 10px 40px var(--shadow);
    border: 1px solid var(--border);
  }
  #popupTitle, #pauseTitle { margin: 0 0 12px; font-size: 28px; }
  #popupStats { margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: var(--ink-soft); white-space: pre-line; }
  #restartBtn, #playBtn, #pauseResumeBtn {
    min-width: 160px; min-height: 48px; border-radius: 10px; border: none;
    background: var(--success); color: var(--success-ink); font-weight: 700; font-size: 17px; cursor: pointer;
  }
  #pauseMenuBtn {
    min-width: 160px; min-height: 44px; border-radius: 10px; border: 2px solid var(--border);
    background: transparent; color: var(--ink); font-weight: 700; font-size: 15px; cursor: pointer;
    margin-top: 10px;
  }

  #rewardedBonusBtn {
    display: block; width: 100%; box-sizing: border-box; min-height: 44px; margin: 0 0 14px;
    border-radius: 10px; border: none; background: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 14px; cursor: pointer;
  }
  #rewardedBonusBtn.hidden { display: none; }
  #dailyBonusBtn {
    display: block; width: 100%; box-sizing: border-box; min-height: 44px; margin: 0 0 14px;
    border-radius: 10px; border: 2px solid var(--border); background: var(--paper-panel-2);
    color: var(--ink); font-weight: 700; font-size: 14px; cursor: pointer;
  }
  #dailyBonusBtn.hidden { display: none; }

  #menuTitle { font-size: 30px; margin: 0 0 6px; letter-spacing: 0.5px; }
  #menuSubtitle { font-size: 15px; color: var(--ink-soft); margin: 0 0 24px; }
  #menuHowToPlay { font-size: 13px; color: var(--ink-soft); margin: -14px 0 20px; line-height: 1.4; }
  #menuFeedback { font-size: 11px; color: var(--ink-soft); opacity: 0.7; margin: 18px 0 0; }
  #menuFeedback a { color: inherit; }
  #menuBadges { display: flex; justify-content: center; gap: 14px; margin-bottom: 20px; }
  #menuBadges canvas { width: 46px; height: 46px; }

  #upgradeShop { margin: 0 0 18px; max-height: 40vh; overflow-y: auto; text-align: left; }
  #upgradeShop h2 { font-size: 13px; color: var(--accent); margin: 10px 0 6px; }
  #upgradeShop h2:first-child { margin-top: 0; }
  .upgradeItem {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 6px 8px; margin-bottom: 4px; border-radius: 8px; background: var(--paper-panel-2);
  }
  .upgradeItem .upgLabel { font-size: 13px; color: var(--ink); }
  .upgradeItem .upgLevel { font-size: 11px; color: var(--ink-soft); }
  .upgradeItem button {
    flex: 0 0 auto; min-width: 74px; min-height: 36px; border-radius: 8px; border: none;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 12px; cursor: pointer;
  }
  .upgradeItem button:disabled { background: var(--paper-panel); color: var(--ink-soft); cursor: default; opacity: 0.6; }

  #devPanel.hidden { display: none; }

  #buildBadge {
    position: fixed; left: calc(4px + env(safe-area-inset-left));
    bottom: calc(4px + env(safe-area-inset-bottom));
    font-size: 10px; color: var(--ink-soft); opacity: 0.35; pointer-events: none;
    z-index: 5; font-family: system-ui, sans-serif;
  }
  #buildBadge.hidden { display: none; }
</style>
</head>
<body>
  <div id="root">
    <div id="topBar">
      <div id="campaignBar">
        <span id="battleLabel">Битва 1</span>
        <span id="trophyBar"><span class="icon">🏆</span><span id="trophyValue">0</span></span>
      </div>
      <div id="foodBar">
        <span class="icon">🍖</span>
        <span id="foodValue">0</span>/<span id="foodCap">0</span>
        <div id="foodBarTrack"><div id="foodBarFill"></div></div>
      </div>
      <div id="topBarRight">
        <button id="fullscreenBtn" class="hidden">⛶</button>
        <button id="pauseBtn">⏸</button>
        <button id="speedBtn">×1</button>
      </div>
    </div>

    <canvas id="game"></canvas>

    <div id="cards">
      <div class="card disabled" id="card-A"><canvas class="unitIcon" width="44" height="44"></canvas><div class="roleLabel" data-i18n="roleA">Боец</div><div class="cost">—</div></div>
      <div class="card disabled" id="card-B"><canvas class="unitIcon" width="44" height="44"></canvas><div class="roleLabel" data-i18n="roleB">Стрелок</div><div class="cost">—</div></div>
      <div class="card disabled" id="card-C"><canvas class="unitIcon" width="44" height="44"></canvas><div class="roleLabel" data-i18n="roleC">Щит</div><div class="cost">—</div></div>
    </div>
  </div>

  <!-- ТЗ №15, блок 6, P-12: имя игры «Битва линий» — решено за основателя
       (тема: противостояние двух армий стик-воинов, N-15 жанровый термин
       в имени). Выводится ТОЛЬКО здесь и в <title>, в бою подписей темы
       нет. Прежнее имя «Муравьиная война» (ТЗ №13) снято вместе с темой. -->
  <div id="menuScreen" class="hidden">
    <div id="menuBox">
      <h1 id="menuTitle" data-i18n="title">Битва линий</h1>
      <div id="menuBadges">
        <canvas id="menuIconA" width="46" height="46"></canvas>
        <canvas id="menuIconB" width="46" height="46"></canvas>
        <canvas id="menuIconC" width="46" height="46"></canvas>
      </div>
      <p id="menuSubtitle" data-i18n="subtitle">Копи еду — выставляй бойцов — разноси базу врага</p>
      <!-- Требования площадки, п.2.2: полное описание управления в игре.
           Одна строка, без отдельного туториал-экрана (CLAUDE.md границы) —
           три касания дают всё управление: карточка спавнит юнита, кнопка
           скорости листает ×1/×2/×3, пауза сверху. -->
      <p id="menuHowToPlay" data-i18n="howToPlay">Тапни по карточке юнита внизу — он выйдет на полосу и будет сражаться сам. Кнопка ×1 наверху ускоряет бой, ⏸ — пауза.</p>
      <button id="dailyBonusBtn" class="hidden"></button>
      <button id="playBtn">Играть</button>
      <!-- Требования площадки, п.6.1: адрес для обратной связи. ТЗ №19:
           только префикс переводится через data-i18n на <span> — mailto
           остаётся вне applyStrings(), иначе textContent всей <p> стёр бы
           дочернюю ссылку. -->
      <p id="menuFeedback"><span data-i18n="feedbackPrefix">Связь с разработчиком:</span> <a href="mailto:qwerty04072000@gmail.com">qwerty04072000@gmail.com</a></p>
    </div>
  </div>

  <div id="pauseScreen" class="hidden">
    <div id="pauseBox">
      <h1 id="pauseTitle" data-i18n="pauseTitle">Пауза</h1>
      <button id="pauseResumeBtn" data-i18n="continueLabel">Продолжить</button>
      <div><button id="pauseMenuBtn" data-i18n="pauseMenu">Выйти в меню</button></div>
    </div>
  </div>

  <div id="popup" class="hidden">
    <div id="popupBox">
      <h1 id="popupTitle">—</h1>
      <p id="popupStats"></p>
      <button id="rewardedBonusBtn" class="hidden"></button>
      <div id="upgradeShop"></div>
      <button id="restartBtn">Ещё раз</button>
    </div>
  </div>

  <div id="devPanel" class="hidden"></div>

  <!-- ТЗ №12, G-07(3): плашка номера билда — маленькая, неинтерактивная,
       low-opacity, вне игровых контролов, уважает safe-area. Показывается
       ТОЛЬКО когда Platform.BUILD реально подставлен build.py (не
       сырой плейсхолдер платформы) — см. main.js
       updateBuildBadge(). На локальном запуске без сборки — не видна. -->
  <div id="buildBadge" class="hidden"></div>

  <script src="i18n.js"></script>
  <script src="platform.js"></script>
  <script src="rig.js"></script>
  <script src="engine.js"></script>
  <script src="campaign.js"></script>
  <script src="main.js"></script>
  <script src="dev.js"></script>
</body>
</html>
